<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimbel - Persiapan CPNS</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2239E5',
                        accent: '#F9FF33',
                        bglight: '#EEEEEE',
                        surfacelight: '#F2F2F2',
                        gradientStart: '#A5B4FC',
                        gradientEnd: '#6B7FFF',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    borderRadius: {
                        'neo': '24px',
                        'neo-lg': '32px',
                        'neo-top': '40px',
                    },
                    borderWidth: {
                        '2': '2px',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #2239E5;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #EEEEEE;
        }
        ::-webkit-scrollbar-thumb {
            background: #2239E5;
            border-radius: 4px;
        }
        
        /* Hide scrollbar for horizontal scrolling areas */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Nav Triangle indicator */
        .nav-triangle {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Inline SVG to ensure self-containment and correct stroke width) ---
        const IconHome = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconBook = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
        const IconEdit = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconTrophy = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>;
        const IconChevronDown = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
        const IconArrowLeft = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
        const IconArrowRight = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
        const IconCheck = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconPlay = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const IconMenu = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        const IconUser = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;

        // --- COMPONENTS ---

        const Button = ({ children, variant = 'primary', className = '', onClick, fullWidth = false }) => {
            const baseStyle = "font-bold rounded-full border-2 border-black px-6 py-3 transition-transform active:scale-95 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-primary text-white hover:bg-blue-700",
                secondary: "bg-white text-black hover:bg-gray-50",
                accent: "bg-accent text-black hover:bg-[#e6ec00]",
                ghost: "bg-transparent text-black border-transparent hover:bg-gray-200"
            };
            return (
                <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`}>
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '', tabCut = false, tabContent = null }) => {
            if (tabCut) {
                return (
                    <div className={`relative ${className}`}>
                        <div className="absolute top-0 right-0 w-32 h-16 bg-bglight z-10 rounded-bl-[24px]"></div>
                        <div className="absolute top-0 right-0 w-32 h-16 z-20 flex items-center justify-end pr-4 gap-2">
                            {tabContent}
                        </div>
                        <div className="border-2 border-black bg-white rounded-neo p-6 relative overflow-hidden h-full">
                            {children}
                        </div>
                        {/* Fake corner radii to blend the cut */}
                        <div className="absolute top-16 right-[126px] w-4 h-4 bg-transparent border-t-2 border-r-2 border-black rounded-tr-xl z-20"></div>
                        <div className="absolute top-[-2px] right-[126px] w-[2px] h-[18px] bg-black z-20"></div>
                        <div className="absolute top-[62px] right-0 w-[128px] h-[2px] bg-black z-20"></div>
                    </div>
                );
            }
            return (
                <div className={`border-2 border-black bg-white rounded-neo p-6 relative overflow-hidden ${className}`}>
                    {children}
                </div>
            );
        };

        const ProgressChip = ({ current, total, time }) => (
            <div className="flex items-center gap-2 text-xs font-medium text-gray-600 bg-surfacelight px-3 py-1 rounded-full w-fit">
                <span>Progres : {current}/{total}</span>
                <span className="w-1 h-1 rounded-full bg-gray-400"></span>
                <span>{time}</span>
            </div>
        );

        const Avatar = ({ src, name, medal = null, size = 'md' }) => {
            const sizes = { sm: 'w-8 h-8', md: 'w-10 h-10', lg: 'w-16 h-16' };
            const medalColors = { gold: 'bg-yellow-400', silver: 'bg-gray-300', bronze: 'bg-orange-400' };
            return (
                <div className="relative inline-block">
                    <div className={`${sizes[size]} rounded-full border-2 border-black overflow-hidden bg-white`}>
                        {src ? <img src={src} alt={name} className="w-full h-full object-cover" /> : 
                        <div className="w-full h-full flex items-center justify-center bg-blue-100 text-primary font-bold text-xl">{name.charAt(0)}</div>}
                    </div>
                    {medal && (
                        <div className={`absolute -bottom-1 -right-1 w-5 h-5 rounded-full border-2 border-black flex items-center justify-center text-[10px] font-bold ${medalColors[medal]}`}>
                            {medal === 'gold' ? '1' : medal === 'silver' ? '2' : '3'}
                        </div>
                    )}
                </div>
            );
        };

        const Badge = ({ children, color = 'bg-surfacelight text-black' }) => (
            <span className={`px-3 py-1 rounded-full text-xs font-semibold ${color}`}>
                {children}
            </span>
        );

        // --- LAYOUT COMPONENTS ---

        const Header = ({ navigateTo, currentScreen }) => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: IconHome },
                { id: 'materi', label: 'Jenis Materi', icon: IconBook },
                { id: 'latihan', label: 'Latihan Soal', icon: IconEdit },
                { id: 'rangking', label: 'Rangking', icon: IconTrophy },
            ];

            return (
                <header className="bg-primary text-white px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => navigateTo('landing')}>
                        <span className="font-extrabold text-2xl tracking-tight">Bimbel</span>
                        <span className="text-xs bg-white text-primary px-2 py-0.5 rounded-full font-bold">PRO</span>
                    </div>

                    {/* Desktop Nav */}
                    <nav className="hidden md:flex bg-white/10 p-1 rounded-full backdrop-blur-sm border border-white/20">
                        {navItems.map(item => {
                            const isActive = currentScreen === item.id;
                            const Icon = item.icon;
                            return (
                                <button 
                                    key={item.id}
                                    onClick={() => navigateTo(item.id)}
                                    className={`relative px-5 py-2 rounded-full font-medium text-sm flex items-center gap-2 transition-all ${isActive ? 'bg-white/20 text-white' : 'text-blue-100 hover:text-white hover:bg-white/5'}`}
                                >
                                    <Icon size={16} />
                                    {item.label}
                                    {isActive && <div className="nav-triangle"></div>}
                                </button>
                            );
                        })}
                    </nav>

                    {/* User Profile */}
                    <div className="hidden md:flex items-center gap-3 cursor-pointer">
                        <Avatar name="User" />
                        <div className="text-sm">
                            <div className="font-bold">Hi, User !</div>
                            <div className="text-blue-200 text-xs">user@gmail.com</div>
                        </div>
                        <IconChevronDown size={16} />
                    </div>

                    {/* Mobile Menu Toggle */}
                    <button className="md:hidden p-2" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                        <IconMenu />
                    </button>
                </header>
            );
        };

        const BottomNav = ({ navigateTo, currentScreen }) => {
            const navItems = [
                { id: 'dashboard', label: 'Home', icon: IconHome },
                { id: 'materi', label: 'Materi', icon: IconBook },
                { id: 'latihan', label: 'Latihan', icon: IconEdit },
                { id: 'rangking', label: 'Rangking', icon: IconTrophy },
                { id: 'profil', label: 'Profil', icon: IconUser },
            ];

            return (
                <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black px-4 py-3 flex justify-between items-center z-50 pb-safe">
                    {navItems.map(item => {
                        const isActive = currentScreen === item.id;
                        const Icon = item.icon;
                        return (
                            <button 
                                key={item.id}
                                onClick={() => navigateTo(item.id)}
                                className={`flex flex-col items-center gap-1 min-w-[60px] ${isActive ? 'text-primary font-bold' : 'text-gray-500 font-medium'}`}
                            >
                                <div className={`p-1.5 rounded-xl ${isActive ? 'bg-blue-100' : ''}`}>
                                    <Icon size={24} />
                                </div>
                                <span className="text-[10px]">{item.label}</span>
                            </button>
                        );
                    })}
                </div>
            );
        };

        const PageLayout = ({ children, navigateTo, currentScreen, hideNav = false, bgClass="bg-bglight" }) => {
            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {!hideNav && <Header navigateTo={navigateTo} currentScreen={currentScreen} />}
                    
                    {/* Main Content Area with rounded top overlapping header */}
                    <main className={`flex-1 ${bgClass} ${!hideNav ? 'rounded-t-neo-top -mt-4 pt-10 pb-24 md:pb-10 relative z-10' : ''} shadow-[0_-4px_20px_rgba(0,0,0,0.1)]`}>
                        <div className="max-w-[1440px] mx-auto px-4 md:px-8 lg:px-12 w-full h-full">
                            {children}
                        </div>
                    </main>

                    {!hideNav && <BottomNav navigateTo={navigateTo} currentScreen={currentScreen} />}
                </div>
            );
        };

        // --- SCREENS ---

        // 1. Landing Page
        const LandingScreen = ({ navigateTo }) => (
            <PageLayout navigateTo={navigateTo} currentScreen="landing" hideNav>
                <div className="bg-primary min-h-screen -mx-4 md:-mx-8 lg:-mx-12 px-4 md:px-8 lg:px-12 flex flex-col relative overflow-hidden">
                    <nav className="py-6 flex justify-between items-center relative z-20">
                        <div className="text-white font-extrabold text-2xl">Bimbel</div>
                        <div className="hidden md:flex gap-6 text-white font-medium">
                            <a href="#" className="hover:text-accent">Keunggulan</a>
                            <a href="#" className="hover:text-accent">Paket</a>
                            <a href="#" className="hover:text-accent">Testimoni</a>
                        </div>
                        <Button variant="secondary" onClick={() => navigateTo('auth')}>Masuk</Button>
                    </nav>

                    <div className="flex-1 flex flex-col md:flex-row items-center pt-10 pb-20 relative z-20 gap-10">
                        <div className="flex-1 text-white space-y-6">
                            <Badge color="bg-accent text-black">Batch 2026 Dibuka!</Badge>
                            <h1 className="text-5xl md:text-7xl font-extrabold leading-tight">
                                Lolos CPNS<br/>Lebih Siap<br/>Bareng <span className="text-accent underline decoration-4 underline-offset-8">Bimbel</span>
                            </h1>
                            <p className="text-lg md:text-xl text-blue-100 max-w-lg">
                                Platform belajar SKD CPNS terbaik dengan materi terupdate, try out mirip aslinya, dan analisa pintar.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                <Button variant="accent" onClick={() => navigateTo('onboarding')} className="text-lg px-8">Daftar Gratis</Button>
                                <Button variant="ghost" className="text-white border-2 border-white hover:bg-white/10 text-lg px-8">Lihat Paket</Button>
                            </div>
                        </div>
                        
                        <div className="flex-1 relative w-full aspect-square md:aspect-auto md:h-[500px]">
                            {/* Decorative Elements */}
                            <div className="absolute top-10 right-10 w-32 h-32 bg-accent rounded-full animate-bounce" style={{animationDuration: '3s'}}></div>
                            <div className="absolute bottom-10 left-10 w-24 h-24 bg-pink-400 transform rotate-12 rounded-neo border-2 border-black"></div>
                            
                            {/* Mockup Cards */}
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[80%] max-w-[350px]">
                                <Card className="shadow-[8px_8px_0_#000] rotate-[-2deg] mb-[-100px] bg-surfacelight relative z-10">
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"><IconTrophy className="text-primary"/></div>
                                        <div>
                                            <div className="font-bold">Skor Try Out</div>
                                            <div className="text-sm text-gray-600">Meningkat pesat!</div>
                                        </div>
                                    </div>
                                    <div className="h-2 w-full bg-gray-200 rounded-full overflow-hidden"><div className="w-[85%] h-full bg-green-500"></div></div>
                                </Card>
                                <Card className="shadow-[8px_8px_0_#000] rotate-[3deg] relative z-20">
                                    <h3 className="font-bold text-xl mb-2">Soal TWK Harian</h3>
                                    <p className="text-sm mb-4">Sebutkan pilar negara yang berfungsi sebagai pemersatu bangsa!</p>
                                    <Button variant="primary" fullWidth>Jawab Sekarang</Button>
                                </Card>
                            </div>
                        </div>
                    </div>

                    {/* Wave Shape Divider */}
                    <div className="absolute bottom-0 left-0 w-full overflow-hidden leading-none rotate-180 z-10">
                        <svg className="relative block w-full h-[50px] md:h-[100px]" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                            <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="#EEEEEE"></path>
                        </svg>
                    </div>
                </div>
                
                {/* Features Section placeholder to show scrolling */}
                <div className="bg-bglight -mx-4 md:-mx-8 lg:-mx-12 px-4 md:px-8 lg:px-12 py-20 relative z-30">
                     <h2 className="text-4xl font-extrabold text-center mb-12">Kenapa Pilih Bimbel?</h2>
                     <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
                        <Card><h3 className="font-bold text-xl mb-2">Materi Terarah</h3><p>Fokus pada kisi-kisi terbaru BKN.</p></Card>
                        <Card><h3 className="font-bold text-xl mb-2">Try Out CAT</h3><p>Simulasi ujian nyata dengan timer.</p></Card>
                        <Card><h3 className="font-bold text-xl mb-2">Analisa Cerdas</h3><p>Ketahui kelemahanmu per sub-bab.</p></Card>
                     </div>
                </div>
            </PageLayout>
        );

        // 2. Auth (Login/Register)
        const AuthScreen = ({ navigateTo }) => (
            <div className="min-h-screen bg-bglight flex p-4 md:p-8">
                <div className="flex-1 bg-primary rounded-neo-lg flex flex-col justify-center items-center text-white p-10 hidden md:flex relative overflow-hidden border-2 border-black">
                    <div className="absolute top-[-50px] left-[-50px] w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
                    <h1 className="text-5xl font-extrabold mb-4 z-10 text-center">Mulai Langkah<br/>Abdi Negaramu.</h1>
                    <p className="text-xl text-blue-100 z-10 text-center">Bergabung dengan ribuan pejuang NIP lainnya.</p>
                </div>
                <div className="flex-1 flex items-center justify-center p-4">
                    <Card className="w-full max-w-md">
                        <h2 className="text-3xl font-extrabold mb-2">Masuk</h2>
                        <p className="text-gray-600 mb-8">Selamat datang kembali, calon ASN!</p>
                        
                        <form className="space-y-4" onSubmit={(e) => { e.preventDefault(); navigateTo('dashboard'); }}>
                            <div>
                                <label className="block text-sm font-bold mb-2">Email</label>
                                <input type="email" placeholder="contoh@gmail.com" className="w-full border-2 border-black rounded-full px-4 py-3 focus:outline-none focus:ring-4 focus:ring-accent/50" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-2">Password</label>
                                <input type="password" placeholder="••••••••" className="w-full border-2 border-black rounded-full px-4 py-3 focus:outline-none focus:ring-4 focus:ring-accent/50" />
                            </div>
                            <div className="flex justify-end">
                                <a href="#" className="text-sm font-bold text-primary hover:underline">Lupa Password?</a>
                            </div>
                            <Button variant="primary" fullWidth type="submit">Masuk</Button>
                            
                            <div className="relative flex items-center py-4">
                                <div className="flex-grow border-t-2 border-gray-200"></div>
                                <span className="flex-shrink-0 mx-4 text-gray-400 text-sm">atau</span>
                                <div className="flex-grow border-t-2 border-gray-200"></div>
                            </div>

                            <Button variant="secondary" fullWidth className="gap-3">
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                Masuk dengan Google
                            </Button>
                        </form>
                        
                        <p className="text-center mt-6 text-sm font-medium">
                            Belum punya akun? <a href="#" className="text-primary font-bold hover:underline" onClick={() => navigateTo('onboarding')}>Daftar</a>
                        </p>
                    </Card>
                </div>
            </div>
        );

        // 3. Onboarding
        const OnboardingScreen = ({ navigateTo }) => {
            const [step, setStep] = useState(1);
            return (
                <div className="min-h-screen bg-bglight flex flex-col items-center justify-center p-4">
                    <Card className="w-full max-w-2xl p-8">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-3xl font-extrabold">Mulai Perjalananmu</h2>
                            <div className="flex gap-2">
                                {[1, 2, 3].map(i => (
                                    <div key={i} className={`w-3 h-3 rounded-full border-2 border-black ${i === step ? 'bg-accent' : 'bg-gray-200'}`}></div>
                                ))}
                            </div>
                        </div>

                        {step === 1 && (
                            <div className="space-y-6">
                                <h3 className="text-xl font-bold">Pilih Target Instansi (Opsional)</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {['Kemenkumham', 'Kejaksaan Agung', 'Kemenkeu', 'Pemprov DKI'].map(inst => (
                                        <div key={inst} className="border-2 border-gray-300 rounded-neo p-4 hover:border-black hover:bg-surfacelight cursor-pointer transition-colors font-medium">
                                            {inst}
                                        </div>
                                    ))}

                                            <div className="font-extrabold text-xl">{s.title}</div>
                                            <Badge color={s.isPass ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}>
                                                {s.isPass ? 'Lulus PG' : 'Gagal PG'}
                                            </Badge>
                                        </div>
                                        <div className="text-4xl font-extrabold mb-1">{s.score}</div>
                                        <div className="text-xs font-bold text-gray-500">Passing Grade: {s.pass}</div>
                                    </Card>
                                ))}
                            </div>
                        </div>

                        {/* Leaderboard / Actions */}
                        <div className="flex-1 flex flex-col gap-6">
                            <Card className="bg-accent text-black border-black">
                                <h3 className="font-extrabold text-xl mb-2">Peringkat Sementara</h3>
                                <div className="text-5xl font-extrabold mb-4">#24</div>
                                <p className="text-sm font-medium">Dari 1,250 peserta simulasi batch ini.</p>
                            </Card>
                            
                            <Button variant="primary" fullWidth className="py-4 text-lg">Lihat Kunci & Pembahasan</Button>
                            <Button variant="secondary" fullWidth className="py-4 text-lg" onClick={() => navigateTo('dashboard')}>Kembali ke Home</Button>
                        </div>
                    </div>
                </PageLayout>
            );
        };

        // 10. Rangking
        const RangkingScreen = ({ navigateTo }) => {
            return (
                <PageLayout navigateTo={navigateTo} currentScreen="rangking">
                    <div className="text-center mb-10">
                        <h1 className="text-4xl font-extrabold mb-4">Papan Peringkat</h1>
                        <div className="flex justify-center gap-2 mb-8">
                            <Button variant="primary" className="px-6 py-2">Nasional</Button>
                            <Button variant="secondary" className="px-6 py-2">Try Out Terakhir</Button>
                        </div>

                        {/* Podium (simplified) */}
                        <div className="flex justify-center items-end gap-4 md:gap-8 h-48 mb-12">
                            {/* Rank 2 */}
                            <div className="flex flex-col items-center">
                                <Avatar name="Budi" medal="silver" size="lg" />
                                <div className="mt-2 font-bold">Budi S.</div>
                                <div className="text-primary font-extrabold">480</div>
                                <div className="w-20 md:w-24 h-20 bg-gray-200 border-2 border-black rounded-t-xl flex justify-center pt-2 font-bold text-xl">2</div>
                            </div>
                            {/* Rank 1 */}
                            <div className="flex flex-col items-center">
                                <Avatar name="Agus" medal="gold" size="lg" />
                                <div className="mt-2 font-bold">Agus T.</div>
                                <div className="text-primary font-extrabold">495</div>
                                <div className="w-24 md:w-28 h-28 bg-accent border-2 border-black rounded-t-xl flex justify-center pt-2 font-bold text-2xl">1</div>
                            </div>
                            {/* Rank 3 */}
                            <div className="flex flex-col items-center">
                                <Avatar name="Citra" medal="bronze" size="lg" />
                                <div className="mt-2 font-bold">Citra W.</div>
                                <div className="text-primary font-extrabold">475</div>
                                <div className="w-20 md:w-24 h-16 bg-orange-200 border-2 border-black rounded-t-xl flex justify-center pt-2 font-bold text-xl">3</div>
                            </div>
                        </div>
                    </div>

                    <Card className="max-w-4xl mx-auto overflow-hidden p-0">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-surfacelight border-b-2 border-black">
                                        <th className="p-4 font-bold w-16 text-center">No</th>
                                        <th className="p-4 font-bold">Peserta</th>
                                        <th className="p-4 font-bold text-center">TWK</th>
                                        <th className="p-4 font-bold text-center">TIU</th>
                                        <th className="p-4 font-bold text-center">TKP</th>
                                        <th className="p-4 font-bold text-center">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[4, 5, 6, 7].map(num => (
                                        <tr key={num} className="border-b-2 border-gray-100 hover:bg-gray-50 transition-colors">
                                            <td className="p-4 font-bold text-center text-gray-500">{num}</td>
                                            <td className="p-4 flex items-center gap-3">
                                                <Avatar name={`P${num}`} size="sm" />
                                                <span className="font-bold">Peserta {num}</span>
                                            </td>
                                            <td className="p-4 text-center font-medium">100</td>
                                            <td className="p-4 text-center font-medium">150</td>
                                            <td className="p-4 text-center font-medium">170</td>
                                            <td className="p-4 text-center font-extrabold text-primary">420</td>
                                        </tr>
                                    ))}
                                    {/* Pinned User Row */}
                                    <tr className="bg-accent/30 border-b-2 border-black">
                                        <td className="p-4 font-extrabold text-center">24</td>
                                        <td className="p-4 flex items-center gap-3">
                                            <Avatar name="User" size="sm" />
                                            <span className="font-extrabold">Anda (User)</span>
                                        </td>
                                        <td className="p-4 text-center font-bold">100</td>
                                        <td className="p-4 text-center font-bold">140</td>
                                        <td className="p-4 text-center font-bold">170</td>
                                        <td className="p-4 text-center font-extrabold text-primary">410</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </PageLayout>
            );
        };

        // --- MAIN APP CONTROLLER ---
        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('dashboard');

            // Scroll to top on screen change
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentScreen]);

            const renderScreen = () => {
                switch (currentScreen) {
                    case 'landing': return <LandingScreen navigateTo={setCurrentScreen} />;
                    case 'auth': return <AuthScreen navigateTo={setCurrentScreen} />;
                    case 'onboarding': return <OnboardingScreen navigateTo={setCurrentScreen} />;
                    case 'dashboard': return <DashboardScreen navigateTo={setCurrentScreen} />;
                    case 'materi': return <MateriScreen navigateTo={setCurrentScreen} />;
                    case 'detail_materi': return <DetailMateriScreen navigateTo={setCurrentScreen} />;
                    case 'latihan': return <LatihanScreen navigateTo={setCurrentScreen} />;
                    case 'pengerjaan_soal': return <PengerjaanScreen navigateTo={setCurrentScreen} />;
                    case 'hasil': return <HasilScreen navigateTo={setCurrentScreen} />;
                    case 'rangking': return <RangkingScreen navigateTo={setCurrentScreen} />;
                    // Fallbacks for undefined screens in this demo
                    case 'profil': 
                    default: return (
                        <PageLayout navigateTo={setCurrentScreen} currentScreen={currentScreen}>
                            <Card className="text-center py-20">
                                <h2 className="text-2xl font-bold mb-4">Halaman {currentScreen} sedang dibangun.</h2>
                                <Button variant="primary" onClick={() => setCurrentScreen('dashboard')}>Kembali ke Dashboard</Button>
                            </Card>
                        </PageLayout>
                    );
                }
            };

            return renderScreen();
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
